services:
  - type: web
    name: telegram-maps-lead-bot
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENCODE_ZEN_API_KEY
        sync: false
      - key: OPENCODE_ZEN_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: AI_MODEL
        value: deepseek-v4-flash-free
      - key: HEADLESS
        value: "true"
      - key: DEFAULT_NICHE
        value: "plumbers in Miami"
      - key: MAX_LEADS_PER_SCRAPE
        value: "100"
